<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const e=await (await fetch('data.enc.json',{cache:'no-store'})).json();
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))));}
const $=v=>v==null||v===''?'':(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?'':v>0?'pos':v<0?'neg':'';const M=v=>({v:$(v),c:sg(v)});
const K=v=>String(v??'').replace(/<[^>]*>/g,'').replace(/"/g,'');
const cell=c=>typeof c=='object'&&c?`<td class="${c.c||''}" data-k="${K(c.v)}">${c.v}</td>`:`<td data-k="${K(c)}">${c??''}</td>`;
const SK=t=>{t=t.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return[1,Date.parse(t)];const n=t.replace(/[$,%x]/g,'');if(t!==''&&/^-?\d+(\.\d+)?$/.test(n))return[1,parseFloat(n)];const m=MO.indexOf(t);if(m>=0)return[1,m];return[0,t]};
document.addEventListener('click',e=>{const th=e.target.closest('#app th');if(!th)return;const tb=th.closest('table'),i=th.cellIndex,dir=th.dataset.d==='asc'?'desc':'asc';
 tb.querySelectorAll('th').forEach(h=>{delete h.dataset.d;h.classList.remove('sa','sd')});th.dataset.d=dir;th.classList.add(dir=='asc'?'sa':'sd');
 const rows=[...tb.rows].slice(1).filter(r=>!r.classList.contains('ft'));const ft=[...tb.rows].filter(r=>r.classList.contains('ft'));
 rows.sort((a,b)=>{const x=SK(a.cells[i].dataset.k),y=SK(b.cells[i].dataset.k);let r=x[0]&&y[0]?x[1]-y[1]:String(x[1]).localeCompare(String(y[1]),undefined,{numeric:true});return dir=='asc'?r:-r});
 const p=tb.rows[0].parentNode;rows.forEach(r=>p.appendChild(r));ft.forEach(r=>p.appendChild(r));});
function tbl(id,h,rows,foot,rc){document.getElementById(id).innerHTML='<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map((r,i)=>`<tr class="${rc?rc(i):''}">`+r.map(cell).join('')+'</tr>').join('')+(foot?'<tr class="ft">'+foot.map(cell).join('')+'</tr>':'')+'</table>';}
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bar=(p)=>`<div class="bar"><i data-w="${Math.max(0,Math.min(100,p))}"></i></div>`;
let D,yr=localStorage.rsyr||'2026';
function chart(){const m=D.monthly[yr];const mx=Math.max(1,...m.flatMap(x=>x.map(Math.abs)));const W=900,Hh=260,z=Hh/2+10,s=(Hh/2-10)/mx,cols=['#e8b923','#a3a3a3','#38bdf8'];
 let g=`<line x1="30" x2="${W}" y1="${z}" y2="${z}" stroke="#262626"/>`;
 m.forEach((v,i)=>{const x0=40+i*((W-40)/12);[v[0],v[1],v[2],v[3]].forEach((val,j)=>{const h=Math.abs(val)*s,c=j==3?(val<0?'#ff2d3a':'#22c55e'):cols[j];const y=val>=0?z-h:z;g+=`<rect x="${x0+j*16}" width="14" y="${z}" height="0" data-y="${y}" data-h="${h}" fill="${c}" rx="2"><title>${MO[i]} ${['Income','COGS','Opex','Net'][j]}: ${$(val)}</title></rect>`});g+=`<text x="${x0+22}" y="${Hh+20}" text-anchor="middle">${MO[i]}</text>`});
 document.getElementById('chart').innerHTML=`<div class="muted"><span class="lg" style="background:#e8b923"></span>Income<span class="lg" style="background:#a3a3a3"></span>COGS<span class="lg" style="background:#38bdf8"></span>Opex<span class="lg" style="background:#22c55e"></span>Net +<span class="lg" style="background:#ff2d3a"></span>Net −</div><svg viewBox="0 0 ${W} ${Hh+30}">${g}</svg>`;
 setTimeout(()=>document.querySelectorAll('#chart rect').forEach(r=>{r.setAttribute('y',r.dataset.y);r.setAttribute('height',r.dataset.h)}),RM?0:250);
 tbl('tM',['Month','Income','COGS','Gross profit','Opex','Net profit'],m.map((v,i)=>[MO[i],M(v[0]),$(v[1]),M(v[0]-v[1]),$(v[2]),M(v[3])]),['TOTAL',M(D.annual[yr][0]),$(D.annual[yr][1]),M(D.annual[yr][0]-D.annual[yr][1]),$(D.annual[yr][2]),M(D.annual[yr][3])]);
 document.getElementById('yrs').innerHTML=Object.keys(D.monthly).map(y=>`<button class="pill ${y==yr?'on':''}" data-y="${y}">${y}</button>`).join('');}
function render(){const d=D,k=d.kpi;document.getElementById('gen').textContent='Updated '+d.generated;
 document.getElementById('cards').innerHTML=[['Revenue YTD',k.rev,1],['Net Profit YTD',k.net,1],['Receivables',k.ar],['Payables',k.ap]].map(([l,v,s])=>`<div class="card"><div class="l">${l}</div><div class="v ${s?sg(v):''}">${$(v)}</div></div>`).join('')+`<div class="card"><div class="l">Gross Margin</div><div class="v pos">${k.gm}%</div>${bar(k.gm)}</div>`;
 tbl('tA',['Year','Income','COGS','Gross profit','Operating expense','Net profit','Margin'],Object.entries(d.annual).map(([y,v])=>[y,M(v[0]),$(v[1]),M(v[0]-v[1]),$(v[2]),M(v[3]),{v:((v[0]-v[1])/v[0]*100).toFixed(1)+'%'+bar((v[0]-v[1])/v[0]*100),c:''}]));
 const net=d.cash.reduce((a,x)=>a+x[1],0);tbl('tCash',['Account','Balance'],d.cash.map(x=>[x[0],M(x[1])]),['NET',M(Math.round(net*100)/100)]);
 chart();
 const t25=d.cust.reduce((a,r)=>a+r[1],0),t26=d.cust.reduce((a,r)=>a+r[3],0);
 tbl('tC',['Customer','2025 sales','2025 share','2025 invoices','2026 YTD sales','2026 share','2026 invoices'],d.cust.map(r=>[r[0],M(r[1]),{v:(r[1]/t25*100).toFixed(1)+'%'+bar(r[1]/t25*100),c:''},r[2],M(r[3]),{v:(r[3]/t26*100).toFixed(1)+'%'+bar(r[3]/t26*100),c:''},r[4]]),['TOTAL',M(t25),'',d.cust.reduce((a,r)=>a+r[2],0),M(t26),'',d.cust.reduce((a,r)=>a+r[4],0)]);
 const ti=d.items.reduce((a,r)=>a+r[2],0);tbl('tI',['Item','Qty sold','Amount','Avg price','Share'],d.items.map(r=>[r[0],r[1],M(r[2]),$(r[3]),{v:(r[2]/ti*100).toFixed(1)+'%'+bar(r[2]/ti*100),c:''}]),['TOTAL','',M(ti),'','']);
 tbl('tAR',['Customer','Current','1–15 days','16–30','31–45','>45','Total'],d.ar.map(r=>[r[0],$(r[1]),$(r[2]),$(r[3]),$(r[4]),$(r[5]),M(r[6])]),['TOTAL',...[1,2,3,4,5].map(i=>$(d.ar.reduce((a,r)=>a+r[i],0))),M(d.ar.reduce((a,r)=>a+r[6],0))]);
 tbl('tInv',['Invoice #','Date','Due','Customer','Status','Total','Balance'],d.inv.map(r=>[r[0],r[1],r[2],r[3],{v:`<span class="st ${r[4]}">${r[4]}</span>`,c:''},M(r[5]),r[6]?{v:$(r[6]),c:'neg'}:$(0)]),null,i=>d.inv[i][4]!='paid'?'open':'');}
function countUp(el){const t=el.textContent.trim();const m=t.match(/^(-?\$?)([\d,]+(?:\.\d+)?)(%|x)?$/);if(!m||RM)return;const fin=parseFloat(m[2].replace(/,/g,''));const dec=(m[2].split('.')[1]||'').length;const fmt=v=>m[1]+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(m[3]||'');
 const t0=performance.now();el.textContent=fmt(0);(function f(n){const p=Math.min(1,(n-t0)/1200),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(fin*e):t;if(p<1)requestAnimationFrame(f)})(t0);}
function fx(){document.querySelectorAll('#app section:not([style*="none"]) :is(h2,.scroll,.card,.chartbox)').forEach((e,i)=>{e.classList.add('fx-in');e.style.animationDelay=Math.min(i*45,1400)+'ms'});

/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;

    if(/^(TABLE|UL|OL|SCRIPT|STYLE|CANVAS)$/.test(e.tagName)||e.querySelector('table,ul,ol,canvas'))return null;
    var hh=e.querySelector('h2,h3,h4,h5,h6');if(hh&&sigKids(e)<=4&&(e.textContent||'').length<200)return e;
    return null;
  }
  function boxA(t){ // (a) a styled box with its own header that holds the table -> fold the whole box
    for(var a=t.parentElement,n=0;a&&a!==document.body&&n<8;a=a.parentElement,n++){
      if(a.hasAttribute('data-nocollapse'))return null;
      if(a.hasAttribute('data-collapsible')||boxy(a)){var f=findHdr(a,t);
        if(f){var hs=a.querySelectorAll(HSEL),own=0;for(var i=0;i<hs.length;i++)if(!f.hdr.contains(hs[i])&&hs[i]!==f.hdr)own++;
          if(!own||a.hasAttribute('data-collapsible')){f.box=a;return f;}}
        return null;} // nearest styled box decides
    }
    return null;
  }
  function boxB(t){ // (b) table is its own box: nearest heading before it folds the table block
    var U=t;while(U.parentElement&&U.parentElement!==document.body&&sigKids(U.parentElement)===1)U=U.parentElement;
    for(var lv=0;lv<4&&U&&U!==document.body;lv++){
      for(var e=U.previousElementSibling;e;e=e.previousElementSibling){var h=hdr2(e);if(h)return {hdr:h,unit:U};
        if(e.matches(HSEL)||e.querySelector(HSEL))break;}
      var P=U.parentElement;if(!P||P===document.body||P.hasAttribute('data-nocollapse'))return null;
      var hs=P.querySelectorAll(HSEL),bad=false;for(var i=0;i<hs.length;i++)if(!U.contains(hs[i])&&!(hs[i].compareDocumentPosition(U)&4)){bad=true;break;} // heading after U inside P
      if(bad)return null;U=P;if(U.querySelector(HSEL))return null;
    }
    return null;
  }
  function collapseScan(){
    var seen={},boxes=[],heads=[],ts=document.querySelectorAll('table,ul,ol,[data-collapsible]');
    for(var i=0;i<ts.length;i++){var t=ts[i];
      if(t.closest('[data-nocollapse],.bxd-h,.bxd-c,#bxd-reset,nav,thead,tfoot,.bxd-colu'))continue;
      if(t.hasAttribute('data-collapsible')){for(var k=0;k<t.children.length;k++){var hh=isHdr(t.children[k]);if(hh){if(boxes.indexOf(t)<0){boxes.push(t);mk({host:t,hdr:hh,box:t},seen);}break;}}continue;}
      if(t.tagName==='TABLE'){if(t.rows.length<3||t.parentElement.closest('table'))continue;}
      else if(t.children.length<5||t.parentElement.closest('ul,ol,table'))continue;
      if(!t.getClientRects().length&&!t.closest('.bxd-col'))continue;
      if(inFixed(t))continue;
      var f=boxA(t);
      if(f){if(boxes.indexOf(f.box)<0){boxes.push(f.box);mk(f,seen);}continue;}
      if(t.closest('.bxd-col'))continue;
      var g=boxB(t);if(!g)continue;
      var hi=heads.indexOf(g.hdr);
      if(hi<0){heads.push(g.hdr);g.hdr.__bxdU=[g.unit];mk({hdr:g.hdr,units:g.hdr.__bxdU,box:g.hdr},seen);}
      else if(g.hdr.__bxdU.indexOf(g.unit)<0){g.hdr.__bxdU.push(g.unit);var c=g.hdr.querySelector('.bxd-c');if(c)tgl(c,c.__bxdHost,c.__bxdK,!!col[c.__bxdK]);}
    }
  }
  function mk(f,seen){
    var k=f.units?'h:'+clean(f.hdr.textContent):ikey(f.box);seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+='~'+seen[k];
    var hd=f.hdr,tgt=/^H[1-6]$/.test(hd.tagName)?hd:(hd.querySelector(HSEL)||hd);
    if(!f.units&&!hd.classList.contains('bxd-hd'))hd.classList.add('bxd-hd');
    var h=null;for(var i=0;i<tgt.children.length;i++)if(tgt.children[i].classList.contains('bxd-c')){h=tgt.children[i];break;}
    if(!h){h=document.createElement('button');h.type='button';h.className='bxd-c';h.setAttribute('data-noboxdrag','');tgt.insertBefore(h,tgt.firstChild);}
    h.__bxdK=k;h.__bxdHost=f.units?{units:f.units}:f.host;tgl(h,h.__bxdHost,k,!!col[k]);
  }
  function storeCol(){try{if(Object.keys(col).length)localStorage.setItem(LC,JSON.stringify(col));else localStorage.removeItem(LC);}catch(e){}}
  function onTgl(e){var h=e.target.closest&&e.target.closest('.bxd-c');if(!h)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(e.type!=='click')return;var k=h.__bxdK,host=h.__bxdHost;if(!k||!host)return;var on=!col[k];if(on)col[k]=1;else delete col[k];storeCol();tgl(h,host,k,on);later();}
  document.addEventListener('click',onTgl,true);
  ['pointerdown','mousedown','touchstart','dblclick'].forEach(function(n){document.addEventListener(n,function(e){if(e.target.closest&&e.target.closest('.bxd-c'))e.stopPropagation();},{capture:true,passive:true});});
  window.boxcollapseAll=function(on){[].forEach.call(document.querySelectorAll('.bxd-c'),function(h){if(!h.__bxdK)return;if(on)col[h.__bxdK]=1;else delete col[h.__bxdK];tgl(h,h.__bxdHost,h.__bxdK,!!on);});storeCol();};
  function later(){clearTimeout(timer);timer=setTimeout(scan,250);}
  function store(){try{if(Object.keys(saved).length)localStorage.setItem(LS,JSON.stringify(saved));else localStorage.removeItem(LS);}catch(e){}showReset();}
  function showReset(){var b=document.getElementById('bxd-reset');
    if(!b&&document.body){b=document.createElement('button');b.id='bxd-reset';b.type='button';b.textContent='↺ Reset layout';b.setAttribute('data-noboxdrag','');
      b.title='Put every box back in its original spot';b.onclick=resetLayout;document.body.appendChild(b);}
    if(b){var v=Object.keys(saved).length?'block':'none';if(b.style.display!==v)b.style.display=v;}}
  function resetLayout(){
    var cs=containers();saved={};store();
    cs.forEach(function(c){var list=items(c);if(list.length<2)return;var ck=ckey(c);if(orig[ck])arrange(c,ck,list,keys(list),orig[ck]);});
  }
  window.boxdragReset=resetLayout;
  function swap(a,b){var m=document.createComment('bxd');a.parentNode.insertBefore(m,a);b.parentNode.insertBefore(a,b);m.parentNode.replaceChild(b,m);}

  // ---- dragging (pointer events: mouse, pen, touch) ----
  document.addEventListener('pointerdown',function(e){
    var h=e.target.closest&&e.target.closest('.bxd-h');if(!h||e.button>0)return;
    var it=h.parentElement,c=it&&it.__bxdC;if(!c)return;
    e.preventDefault();e.stopPropagation();
    try{h.setPointerCapture(e.pointerId);}catch(x){}
    dragging={h:h,it:it,c:c,id:e.pointerId,x0:e.clientX+scrollX,y0:e.clientY+scrollY,cx:e.clientX,cy:e.clientY,on:false,tgt:null,raf:0};
  },true);
  function edge(){ if(!dragging||!dragging.on)return;var d=dragging,v=0,H=innerHeight,M=Math.min(80,H*.12);
    if(d.cy>=M&&d.cy<=H-M)d.armed=true;if(d.armed){if(d.cy<M)v=-Math.ceil((M-d.cy)/4);else if(d.cy>H-M)v=Math.ceil((d.cy-(H-M))/4);}
    if(v){scrollBy(0,v);move(d.cx,d.cy);}d.raf=requestAnimationFrame(edge);}
  function move(x,y){var d=dragging;d.cx=x;d.cy=y;
    d.it.style.transform='translate('+(x+scrollX-d.x0)+'px,'+(y+scrollY-d.y0)+'px)';
    var el=document.elementFromPoint(x,y),t=null;
    for(var a=el;a&&a!==document.body;a=a.parentElement){if(a.__bxdC===d.c&&a!==d.it&&a.parentElement===d.c){t=a;break;}}
    if(t!==d.tgt){if(d.tgt)d.tgt.classList.remove('bxd-tgt');d.tgt=t;if(t)t.classList.add('bxd-tgt');}}
  document.addEventListener('pointermove',function(e){var d=dragging;if(!d||e.pointerId!==d.id)return;e.preventDefault();
    if(!d.on){if(Math.abs(e.clientX+scrollX-d.x0)+Math.abs(e.clientY+scrollY-d.y0)<5)return;
      d.on=true;d.it.classList.add('bxd-src');document.body.classList.add('bxd-on');d.raf=requestAnimationFrame(edge);}
    move(e.clientX,e.clientY);},{capture:true,passive:false});
  function end(e,cancel){var d=dragging;if(!d||e.pointerId!==d.id)return;dragging=null;cancelAnimationFrame(d.raf);
    d.it.classList.remove('bxd-src');d.it.style.transform='';document.body.classList.remove('bxd-on');
    if(d.tgt)d.tgt.classList.remove('bxd-tgt');
    if(d.on&&!cancel&&d.tgt&&d.tgt.parentElement===d.c&&d.it.parentElement===d.c){
      swap(d.it,d.tgt);var list=items(d.c);saved[d.c.__bxdKey||ckey(d.c)]=keys(list);store();}
    later();}
  document.addEventListener('pointerup',function(e){end(e,false);},true);
  document.addEventListener('pointercancel',function(e){end(e,true);},true);
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.bxd-h')){e.preventDefault();e.stopPropagation();}},true);
  document.addEventListener('touchmove',function(e){if(dragging)e.preventDefault();},{passive:false});

  function start(){scan();new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t.id==='bxd-reset'||dragging)continue;var an=ms[i].addedNodes;if(!(t.classList&&(t.classList.contains('bxd-h')||t.classList.contains('bxd-c')))&&!(an.length===1&&(an[0].className==='bxd-h'||an[0].className==='bxd-c'))){later();return;}}
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    addEventListener('resize',later);addEventListener('load',later);}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
